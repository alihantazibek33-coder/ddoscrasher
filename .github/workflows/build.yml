name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Репозиторийді клондау
        uses: actions/checkout@v4

      - name: JDK орнату (Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Wrapper-ге орындау құқығын беру
        run: chmod +x gradlew

      - name: Gradle көмегімен модты жинау (Build)
        run: ./gradlew build

      - name: Жинақталған файлды сақтау (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AlihBots-Mod-Jar
          path: build/libs/*.jar
